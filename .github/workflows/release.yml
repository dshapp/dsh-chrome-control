name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Build the Rust daemon for each target platform/arch. The binaries are
  # uploaded as artifacts and merged into the npm tarball by the release job.
  build-binary:
    name: Build daemon (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-13
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build release binary
        working-directory: daemon
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary under binaries/<platform>-<arch>
        shell: bash
        run: |
          set -euo pipefail
          BIN=chrome-daemon
          if [[ "${{ matrix.platform }}" == "win32" ]]; then BIN=chrome-daemon.exe; fi
          mkdir -p "binaries/${{ matrix.platform }}-${{ matrix.arch }}"
          cp "daemon/target/${{ matrix.target }}/release/$BIN" "binaries/${{ matrix.platform }}-${{ matrix.arch }}/$BIN"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: binaries/${{ matrix.platform }}-${{ matrix.arch }}/chrome-daemon*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish to npm
    needs: build-binary
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Verify staged binaries
        shell: bash
        run: |
          set -euo pipefail
          find binaries -type f | sort
          test -f binaries/darwin-arm64/chrome-daemon
          test -f binaries/darwin-x64/chrome-daemon
          test -f binaries/linux-x64/chrome-daemon
          test -f binaries/win32-x64/chrome-daemon.exe

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use OIDC-capable npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate package
        run: |
          pnpm run check
          npm pack --dry-run --ignore-scripts

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"

          if [[ "$LOCAL_VERSION" == "$PUBLISHED_VERSION" ]]; then
            npm version patch --no-git-tag-version --ignore-scripts
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $PACKAGE_NAME@$VERSION" >&2
            exit 1
          fi

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Commit version and create tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG [skip ci]"
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Create full changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## Changelog"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log "$PREVIOUS_TAG..$TAG" --no-merges \
                --pretty=format:'- %s ([%h](https://github.com/dshapp/dsh-chrome-control/commit/%H))'
              echo
              echo
              echo "**Full comparison**: https://github.com/dshapp/dsh-chrome-control/compare/$PREVIOUS_TAG...$TAG"
            else
              git log "$TAG" --no-merges --reverse \
                --pretty=format:'- %s ([%h](https://github.com/dshapp/dsh-chrome-control/commit/%H))'
              echo
            fi
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md

      - name: Write summary
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

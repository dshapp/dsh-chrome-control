# dsh-chrome bundle: three rows that together give the agent control of the
# user's real Chrome.
#
#   1. the server row starts (or adopts) the standalone Rust chrome-daemon on
#      127.0.0.1:37086, which serves POST /chrome/mcp (MCP Streamable HTTP),
#      GET /chrome/ws (the extension's WebSocket) and GET /chrome/status. On
#      the harness's own web server it only proxies GET /chrome/status. It
#      also loads the in-box mcp-client bridge against the daemon's
#      /chrome/mcp, which publishes the catalog as mcp__chrome__* with no
#      adapter code;
#   2. the skills row teaches the agent how to drive those tools;
#   3. the web-search row registers the `chrome-browser` provider for the
#      built-in web_search tool. It stays unused (off) until the user sets
#      `web.searchProvider: chrome-browser`; `engine` picks Google (default),
#      Bing, Baidu, Sogou, or Toutiao.
#
# The browser extension is installed by the user, by design, from the Chrome
# Web Store ("Deepseek Harness APP", id kgjjicancjnedmappjhefngdjaommpop):
# installing an extension is a decision only the browser's owner can make.
# Its bridge socket defaults to ws://127.0.0.1:37086/chrome/ws, so nothing
# needs pointing at dsh web for the tools to work.
- insert:
    - id: chrome-server
      name: 'dsh-chrome-control/server'

    - id: chrome-skills
      name: 'dsh-chrome-control/skills'

    - id: chrome-web-search
      name: 'dsh-chrome-control/web-search'
